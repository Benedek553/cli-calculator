<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CLI Calculator</title>
<style>
    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: "JetBrains Mono", monospace;
        line-height: 1.6;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(transparent 95%, rgba(255,255,255,0.06) 100%),
            linear-gradient(90deg, transparent 95%, rgba(255,255,255,0.06) 100%);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
    }

    header {
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 1;
    }

    .brand {
        font-weight: bold;
        font-size: 20px;
    }

    nav a {
        margin-left: 30px;
        color: #ccc;
        text-decoration: none;
        font-size: 15px;
    }
    nav a:hover { color: #fff; }

    .hero {
        padding: 100px 40px;
        position: relative;
        z-index: 1;
        max-width: 900px;
    }

    .hero h1 {
        font-size: 75px;
        font-weight: 700;
        margin: 0 0 20px 0;
        line-height: 1.1;
    }

    .hero .subtitle {
        font-size: 22px;
        color: #ccc;
        margin-bottom: 40px;
    }

    .buttons a {
        display: inline-block;
        border: 1px solid #fff;
        padding: 12px 22px;
        margin-right: 20px;
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        cursor: none;
    }

    .buttons a:hover {
        background: #fff;
        color: #000;
    }

    .section {
        padding: 60px 40px;
        max-width: 1000px;
        position: relative;
        z-index: 1;
    }

    /* Hero "code" line: remove box visuals */
    .code {
        background: transparent;
        border: none;
        padding: 0;
        white-space: pre-wrap;
        font-size: 15px;
        overflow-x: auto;
        min-height: 4.5em;
    }

    /* Blinking block cursor */
    .caret {
        display: inline-block;
        width: 8px;
        height: 1em;
        margin-left: 2px;
        background: #fff;
        vertical-align: -0.15em;
        animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    h2 {
        font-size: 32px;
        margin-bottom: 15px;
        margin-top: 40px;
    }

    .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        margin: -16px 0 0 -16px;
        border: 2px solid #fff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
    }

    .cursor-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
    }
</style>
</head>
<body>

<header>
    <div class="brand">CLI-CALCULATOR</div>
    <nav>
        <a href="#features">Features</a>
        <a href="#install">Install</a>
        <a href="https://github.com/Benedek553/cli-calculator/wiki">Docs</a>
        <a href="https://github.com/Benedek553/cli-calculator" target="_blank">GitHub</a>
    </nav>
</header>

<section class="hero">
    <div class="code" id="typewriter"><span id="text"></span><span class="caret" aria-hidden="true"></span></div>

    <h1>Precision unleashed.<br>Math at the speed of thought.</h1>

    <div class="subtitle">
        Pure C++. Zero overhead.<br>A calculator that works as fast as you think.
    </div>

    <div class="buttons">
        <a href="/docs/getstarted" target="_blank">INSTALL</a>
        <a href="/docs/index" target="_blank">DOCS</a>
    </div>
</section>

<script>
(() => {
    // NOTE: Use \n (escaped newline) to avoid "unescaped line break" syntax errors.
    const target = "$ cli-calculator --eval 2 * (3 + 4)\n# → 14";

    const textEl = document.getElementById("text");
    if (!textEl) return;

    // Tunables
    const baseDelayMs = 35;
    const jitterMs = 60;
    const typoChance = 0.08;      // per keystroke
    const backspacePauseMs = 120; // how long the wrong char stays visible
    const afterBackspaceExtraDelayMs = 50;

    let current = "";
    let i = 0;

    const rand = () => Math.random();

    function delay(base = baseDelayMs) {
        return base + rand() * jitterMs;
    }

    function randomWrongChar() {
        // Prefer letters + a few common CLI chars for a more realistic typo
        const pool = "abcdefghijklmnopqrstuvwxyz-/._";
        return pool[Math.floor(rand() * pool.length)];
    }

    function typeStep() {
        if (i >= target.length) return;

        // don't typo on newlines (looks weird), but keep it configurable if you want
        const nextChar = target[i];
        const canTypo = nextChar !== "\n";

        if (canTypo && rand() < typoChance) {
            // Insert a wrong char, then backspace it, then continue
            current += randomWrongChar();
            textEl.textContent = current;

            setTimeout(() => {
                current = current.slice(0, -1);
                textEl.textContent = current;
                setTimeout(typeStep, delay(afterBackspaceExtraDelayMs));
            }, backspacePauseMs);
            return;
        }

        current += nextChar;
        textEl.textContent = current;
        i++;
        setTimeout(typeStep, delay());
    }

    typeStep();
})();
</script>

<script>
(() => {
    // Basic sanity checks without relying on randomness or timing.
    try {
        const textEl = document.getElementById("text");
        const caretEl = document.querySelector(".caret");
        console.assert(!!textEl, "[typewriter] #text element missing");
        console.assert(!!caretEl, "[typewriter] caret element missing");

        // Ensure we didn't reintroduce an actual line break into a quote-delimited string.
        // (This test is a reminder: target should use \n or template literal.)
        const example = "$ test\\nline2";
        console.assert(example.includes("\\n"), "[typewriter] newline escape sanity failed");
    } catch (e) {
        // Avoid breaking the page if console.assert is not available.
    }
})();
</script>

</body>
</html>
