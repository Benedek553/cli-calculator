# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on mac

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install CLI tools and Homebrew
      run: |
          brew install boost
          brew install tree
          echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV

    - name: Vendor Homebrew packages into workspace
      run: |
          set -e
          VENDOR_DIR="$GITHUB_WORKSPACE/cmake/third_party"
          mkdir -p "$VENDOR_DIR"
          BOOST_PREFIX="$(brew --prefix boost)"
          echo "Copying boost from: $BOOST_PREFIX -> $VENDOR_DIR/boost"
          rsync -a "$BOOST_PREFIX/" "$VENDOR_DIR/boost/"
          # optional: also copy top-level Homebrew includes if you need them
          #if [ -d "/opt/homebrew/" ]; then
          #  rsync -a /opt/homebrew/ "$VENDOR_DIR/homebrew/"
          #fi
          #ls -la "$VENDOR_DIR" || true

    - name: Configure CMake
      run: cmake -B "$GITHUB_WORKSPACE/build" -S "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBOOST_ROOT="$GITHUB_WORKSPACE/cmake/third_party/boost" -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake/third_party/boost"

    - name: Debug copied boost
      run: |
        echo "Boost include preview:"
        ls -la "$GITHUB_WORKSPACE/cmake/third_party/boost/include" | head -n 20 || true
        find "$GITHUB_WORKSPACE/cmake/third_party/boost/" -type d -print

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cli-calculator-mac
        path: |
          ${{github.workspace}}/build/src/calculator*
          ${{github.workspace}}/build/src/divisors*
        if-no-files-found: warn

