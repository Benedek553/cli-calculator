name: Xcode on macOS with Conan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  xcode_with_conan:
    name: Xcode + Conan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Conan
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade conan

      - name: Show Conan version
        run: conan --version

      - name: Ensure conanfile (create minimal if none)
        run: |
          if [ -f conanfile.txt ] || [ -f conanfile.py ]; then
            echo "conanfile exists"
          else
            cat > conanfile.txt <<'EOF'
[requires]
boost/1.90.0

[generators]
VirtualRunEnv
EOF
            echo "Wrote conanfile.txt with boost/1.90.0"
          fi

      - name: Conan install (generate VirtualRunEnv)
        run: |
          set -e
          mkdir -p build
          conan install . --install-folder=build -s os=Macos -s build_type=$BUILD_TYPE -s arch=armv8 --build=missing -g VirtualRunEnv

      - name: Build with xcodebuild (source Conan env then build)
        run: |
          set -e
          # source the Conan generated virtual run environment in the same shell
          if [ -f build/activate_run.sh ]; then
            source build/activate_run.sh
          elif [ -f build/activate.sh ]; then
            source build/activate.sh
          fi

          # debug: show relevant env vars
          env | egrep 'CONAN|CPLUS|C_INCLUDE|LIBRARY' || true

          # locate workspace or project
          WORKSPACE=$(find . -maxdepth 3 -name '*.xcworkspace' -print -quit || true)
          PROJECT=$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit || true)

          if [ -n "$WORKSPACE" ]; then
            echo "Using workspace: $WORKSPACE"
            # try to pick first scheme from the xcodebuild -list output
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | sed -n '/Schemes:/,$p' | sed '1d' | awk 'NF{print $1; exit}' || true)
            if [ -z "$SCHEME" ]; then
              echo "No scheme detected — building workspace with configuration only"
              xcodebuild -workspace "$WORKSPACE" -configuration "$BUILD_TYPE" build
            else
              echo "Building scheme: $SCHEME"
              xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration "$BUILD_TYPE" build
            fi

          elif [ -n "$PROJECT" ]; then
            echo "Using project: $PROJECT"
            xcodebuild -project "$PROJECT" -configuration "$BUILD_TYPE" build

          else
            echo "No Xcode workspace or project found. Skipping build."
            exit 0
          fi
